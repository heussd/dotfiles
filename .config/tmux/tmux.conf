# M - Option on macOS

# force a reload of the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf


bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-Enter if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' \
  'split-window -h -c "#{pane_current_path}"' \
  'split-window -v -c "#{pane_current_path}"'


bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Tab select-pane -t :.+
bind -n M-BTab select-pane -t :.-


bind -n S-Left previous-window
bind -n M-L next-window
bind -n S-Right next-window
bind -n M-H previous-window


bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9


bind-key X kill-pane
bind -n M-w kill-pane


# DESIGN TWEAKS

# modern terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# responsive updates
set -g status-interval 5

# pass focus changes to apps (lets vim reload files when its pane is focused)
set -g focus-events on

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# copy mode
setw -g mode-style 'fg=#111418 bg=#89b4fa bold'

# panes
set -g pane-border-style 'fg=#2a2f3a'
set -g pane-active-border-style 'fg=#89b4fa'

set -g mouse on

# command and mode prompts
set -g message-style 'fg=#cdd6f4,bg=#1b1f2a'
set -g message-command-style 'fg=#111418,bg=#a6e3a1'

# window title behavior
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}/#{pane_current_command}'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'default'
set -g status 2
set -g status-format[0] ''
# range=window markers make each window title clickable (MouseDown1Status -> switch to it)
set -g status-format[1] '#[align=left]#{E:status-left}#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange default],#[range=window|#{window_index}]#{E:window-status-current-format}#[norange default]}#[align=right]#{E:status-right}'

set -g status-left ' #S |'
set -g status-left-length 24

set -g status-right-style 'default'
set -g status-right '#{?client_prefix,PREFIX | ,} #(~/.config/tmux/scripts/grade.sh cpu)%%%#[default]  #(~/.config/tmux/scripts/grade.sh memory)%%%#[default] | %Y-%m-%d %H:%M '
set -g status-right-length 90

setw -g window-status-separator ''
setw -g window-status-style 'default'
setw -g window-status-format ' #I #W '

setw -g window-status-current-style 'fg=#111418,bg=#d3d7de'
setw -g window-status-current-format '#[fg=#111418,bg=#d3d7de] #I #W #[default]'
setw -g window-status-activity-style 'default'

set -g clock-mode-colour '#89b4fa'





# Copy on selection
set -g mouse on
set -s set-clipboard off
set -s copy-command 'pbcopy'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Magenta text selection
set -g mode-style "fg=black,bg=magenta"


bind-key g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit-helper"
bind -n M-g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit-helper"
set -g popup-style default

# fzf session / window / pane picker (replaces default choose-tree on prefix+s)
bind-key s display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/picker.sh"
bind -n M-p display-popup -E -w 80% -h 70% "~/.scripts/goto"
bind -n M-n display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "~/.scripts/git-vimi-helper"
bind-key o display-popup -E -w 80% -h 70% "lazydocker"
bind-key u split-window -h -d -c "#{pane_current_path}" "~/.scripts/git-pull-helper"
